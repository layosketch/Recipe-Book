<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════════════════════ -->
<header class="header">
  <div class="logo">
    <span class="logo-icon">🍽</span>
    <span class="logo-text">RecipeBook</span>
  </div>

  <nav class="nav" id="nav">
    <a href="#" class="nav-link" id="navHome">Home</a>
    <a href="#" class="nav-link" id="navFavorites">Favorites</a>
    <a href="#" class="nav-link" id="navShopping">Shopping List</a>
  </nav>

  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- ═══════════════ HERO ══════════════════════════════════ -->
<section class="hero">
  <h1 class="hero-title">
    Discover &amp; Save <span>Delicious Recipes</span>
  </h1>
  <p class="hero-subtitle">Cook smarter. Eat better. Plan your meals with ease.</p>
  <div class="hero-stats">
    <div class="hero-stat">
      <strong id="statTotal">5</strong>
      <span>Recipes</span>
    </div>
    <div class="hero-stat">
      <strong id="statFav">1</strong>
      <span>Favorites</span>
    </div>
    <div class="hero-stat">
      <strong id="statCat">5</strong>
      <span>Categories</span>
    </div>
  </div>
</section>

<!-- ═══════════════ MAIN ══════════════════════════════════ -->
<main class="main">

  <!-- Home View -->
  <div id="homeView" class="view-section active">

    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍  Search recipes or cuisine…" class="search-input">
      <select id="categoryFilter" class="category-select">
        <option value="all">All Categories</option>
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="snack">Snack</option>
        <option value="dessert">Dessert</option>
      </select>
      <button class="btn-add" id="openFormBtn">＋ Add Recipe</button>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-cat="all">All</button>
      <button class="filter-tab" data-cat="breakfast">Breakfast</button>
      <button class="filter-tab" data-cat="lunch">Lunch</button>
      <button class="filter-tab" data-cat="dinner">Dinner</button>
      <button class="filter-tab" data-cat="snack">Snack</button>
      <button class="filter-tab" data-cat="dessert">Dessert</button>
    </div>

    <div class="recipe-grid" id="recipeGrid"></div>

  </div>

  <!-- Favorites View -->
  <div id="favoritesView" class="view-section">
    <p class="section-label">❤ Favorite Recipes</p>
    <div class="recipe-grid" id="favGrid"></div>
  </div>

</main>

<!-- ═══════════════ ADD RECIPE MODAL ══════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <h2 id="modalTitle">Add New Recipe</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Recipe Name *</label>
        <input type="text" id="recipeName" placeholder="e.g. Jollof Rice">
      </div>
      <div class="form-group">
        <label>Emoji</label>
        <input type="text" id="recipeEmoji" placeholder="e.g. 🍚" maxlength="4">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="recipeCategory">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="snack">Snack</option>
          <option value="dessert">Dessert</option>
        </select>
      </div>
      <div class="form-group">
        <label>Cuisine</label>
        <input type="text" id="recipeCuisine" placeholder="e.g. Nigerian, Italian">
      </div>
    </div>

    <div class="form-group">
      <label>Ingredients (one per line) *</label>
      <textarea id="recipeIngredients" rows="5" placeholder="Rice&#10;Tomatoes&#10;Onions&#10;Seasoning"></textarea>
    </div>

    <div class="form-group">
      <label>Instructions</label>
      <textarea id="recipeInstructions" rows="4" placeholder="Step-by-step cooking instructions…"></textarea>
    </div>

    <button class="btn-submit" id="saveRecipeBtn">💾 Save Recipe</button>
  </div>
</div>

<!-- ═══════════════ RECIPE DETAIL MODAL ═══════════════════ -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-modal" id="detailModal">
    <!-- filled by JS -->
  </div>
</div>

<!-- ═══════════════ SHOPPING PANEL ═══════════════════════ -->
<div class="shopping-panel" id="shoppingPanel">
  <h2>🛒 Shopping List</h2>
  <div id="shoppingItems" style="margin-top:16px; flex:1;"></div>
  <button class="btn-close-panel" id="closeShoppingPanel">Close Panel</button>
</div>

<!-- ═══════════════ TOAST ═════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>

</body>
</html>
